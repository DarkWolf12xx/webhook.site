# Main nginx configuration for the webhook.site container.
# The application vhost lives in /etc/nginx/http.d/default.conf (nginx.conf in the repo root).
#
# nginx runs as the unprivileged www-data user (no `user` directive, no root master),
# so it listens on 8080 and keeps its PID and temporary files in writable locations.

worker_processes auto;
pcre_jit on;

# Log to the container's stderr so that `docker logs` shows nginx errors
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not advertise the nginx version
    server_tokens off;

    client_max_body_size 1m;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip_vary on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log off;

    # Only genuine WebSocket upgrades are forwarded to laravel-echo-server. Any other
    # Upgrade value (e.g. "h2c") is dropped so the proxied connection cannot be turned
    # into a tunnel to arbitrary backend paths (H2C smuggling).
    map $http_upgrade $ws_upgrade {
        default          "";
        "~*^websocket$"  websocket;
    }

    map $ws_upgrade $ws_connection {
        default    "";
        websocket  upgrade;
    }

    include /etc/nginx/http.d/*.conf;
}
