# Main nginx configuration for the webhook.site container.
# The application vhost lives in /etc/nginx/http.d/default.conf (nginx.conf in the repo root).

user nginx;
worker_processes auto;
pcre_jit on;

# Log to the container's stderr so that `docker logs` shows nginx errors
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip_vary on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log off;

    include /etc/nginx/http.d/*.conf;
}
