; PHP-FPM settings for webhook.site. Loaded after the image's docker.conf, www.conf
; and zz-docker.conf, so these values win. ${...} values come from the environment.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
; Restart the master if workers keep crashing
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
; Only nginx in the same container talks to PHP-FPM. The base image's zz-docker.conf
; listens on 0.0.0.0:9000, which exposes FastCGI to every container on the network.
listen = 127.0.0.1:9000

; Process management. Webhook requests can sleep for up to 10 s (per-URL "timeout"
; setting), so keep enough workers to avoid starving other users.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; Hard limit per request (max token timeout is 10 s)
request_terminate_timeout = 60s

; Only .php files may be executed (nginx only ever passes index.php)
security.limit_extensions = .php

; Environment is needed for Laravel's configuration (APP_*, REDIS_*, ...)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Do not log request URIs: they contain webhook URL tokens, which are bearer
; credentials for reading captured requests.
access.log = /proc/self/fd/2
access.format = "%R %t \"%m\" %s %{milli}dms %{kilo}Mkb"

; Web requests never need to spawn processes. (Not applied to the CLI, where the
; queue worker's IP block job uses proc_open.)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
