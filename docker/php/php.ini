; Production PHP settings for webhook.site.
; Loaded after php.ini (a copy of php.ini-production) from
; /usr/local/etc/php/conf.d/zz-webhook.ini, so these values win.
; Values in ${...} come from the container environment (defaults in the Dockerfile).

[PHP]
; --- Information disclosure ---------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; php-fpm forwards worker stderr to the container log (catch_workers_output)
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED
html_errors = Off

; --- Remote code inclusion ------------------------------------------------------
allow_url_include = Off
; Nothing in the application opens remote URLs with fopen()/file_get_contents();
; outbound HTTP (Sentry, Pusher) uses ext-curl through Guzzle.
allow_url_fopen = Off

; --- Resource limits --------------------------------------------------------------
; Webhook bodies are capped at 1 MiB by nginx (client_max_body_size). PHP's limit is
; slightly higher so nginx stays the single place that rejects oversized requests.
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 30
max_input_time = 30
post_max_size = 2M
upload_max_filesize = 1M
max_file_uploads = 10
max_input_vars = 1000
max_input_nesting_level = 64
file_uploads = On
default_socket_timeout = 10

; --- Sessions (Laravel manages its own sessions; these harden native PHP sessions) ---
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
; Set PHP_SESSION_COOKIE_SECURE=1 when the site is served over HTTPS.
session.cookie_secure = ${PHP_SESSION_COOKIE_SECURE}
session.cookie_samesite = Lax
; php.net informational advisory (2026-10-23, CVE-2026-109619 / GHSA-6wmf-4rv5-p3rp):
; keep upload progress tracking disabled; the application does not use it.
session.upload_progress.enabled = 0

; --- OPcache ------------------------------------------------------------------------
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code only changes by rebuilding the image; set PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
; when mounting source code for development.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
