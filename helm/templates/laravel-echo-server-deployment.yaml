apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: laravel-echo-server
  name: laravel-echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-echo-server
  template:
    metadata:
      labels:
        app: laravel-echo-server
    spec:
      containers:
        - env:
            - name: ECHO_ALLOW_CORS
              value: "true"
            - name: ECHO_ALLOW_HEADERS
              value: '*'
            - name: ECHO_ALLOW_METHODS
              value: '*'
            - name: ECHO_ALLOW_ORIGIN
              value: '*'
            - name: ECHO_PROTOCOL
              value: http
            - name: ECHO_REDIS_HOSTNAME
              value: redis
            - name: ECHO_REDIS_PORT
              value: "6379"
            - name: LARAVEL_ECHO_SERVER_AUTH_HOST
              value: http://webhook:8084
            - name: LARAVEL_ECHO_SERVER_HOST
              value: 0.0.0.0
            - name: LARAVEL_ECHO_SERVER_PORT
              value: "6001"
          image: webhooksite/laravel-echo-server@sha256:b013ed5b591c800f78cb89c4bb49de64316eb650277fa898d372e24b2fc5f576
          name: laravel-echo-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - protocol: TCP
              containerPort: 6001
      restartPolicy: Always
