apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webhook-site
  name: webhook-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-site
  template:
    metadata:
      labels:
        app: webhook-site
    spec:
      securityContext:
        runAsNonRoot: true
        # www-data in the Alpine-based image
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-site
          args:
            - php
            - artisan
            - queue:work
            - --daemon
            - --tries=3
            - --timeout=10
          env:
            # Never enable debug mode on a reachable instance (stack traces in responses)
            - name: APP_DEBUG
              value: "false"
            - name: APP_ENV
              value: production
            - name: APP_LOG
              value: errorlog
            - name: APP_URL
              value: http://127.0.0.1:8084
            - name: BROADCAST_DRIVER
              value: redis
            - name: CACHE_DRIVER
              value: redis
            - name: DB_CONNECTION
              value: sqlite
            - name: ECHO_HOST_MODE
              value: path
            - name: QUEUE_DRIVER
              value: redis
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          image: webhooksite/webhook.site
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            # The container runs unprivileged and listens on 8080
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
