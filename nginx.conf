server {
    # The container runs as an unprivileged user, so nginx listens on 8080.
    listen   8080; ## listen for ipv4
    #listen   [::]:8080 default ipv6only=on; ## listen for ipv6
    server_name  application;

    # Request URLs contain webhook tokens (bearer credentials): no access log.
    access_log off;
    error_log /dev/stderr;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # this causes issues with Docker
    sendfile off;

    # Webhook senders may use header names with underscores (see #160).
    # Note: the application never trusts proxy headers such as X-Forwarded-For,
    # so header-name normalisation cannot be used to spoof the client address.
    underscores_in_headers on;

    # --- Request limits -------------------------------------------------------
    # Captured webhook bodies are limited to 1 MiB (same as the previous default)
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve hidden files, PHP sources or server-specific config files from
    # disk. Such paths are handed to the application instead, so webhook URLs like
    # /<token>/callback.php are captured rather than answered with 404.
    location ~ (/\.|\.php(/|$)|^/web\.config$) {
        rewrite ^ /index.php last;
    }

    # Static assets built into the image
    location ~* \.(?:css|js|map|ico|gif|png|jpe?g|svg|woff2?|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # look for local files on the container before sending the request to fpm
    location / {
        try_files $uri /index.php?$query_string;
    }

    # socket.io
    location ^~ /socket.io {
        proxy_pass http://laravel-echo-server:6001;
        proxy_http_version 1.1;
        # $ws_upgrade / $ws_connection: see docker/nginx/nginx.conf
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $ws_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $ws_upgrade;
    }

    # The front controller is the only script ever executed by PHP-FPM
    location = /index.php {
        fastcgi_pass            127.0.0.1:9000;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param           REQUEST_METHOD  $request_method;
        fastcgi_param           QUERY_STRING    $query_string;
        fastcgi_param           CONTENT_TYPE    $content_type;
        fastcgi_param           CONTENT_LENGTH  $content_length;
        # Httpoxy exploit (https://httpoxy.org/) fix
        fastcgi_param           HTTP_PROXY "";
        # Per-URL response delay can be up to 10 s
        fastcgi_read_timeout    60s;
        fastcgi_hide_header     X-Powered-By;
    }
}
